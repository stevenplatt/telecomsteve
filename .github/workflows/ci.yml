# CI for the telecomsteve site.
#
# The `test` job enforces 100% unit-test coverage (thresholds live in
# telecomsteve/vite.config.ts, so a drop below 100% fails the build). This job
# is the required status check that will gate code deployment once a deploy
# workflow is added.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint, coverage gate (100%), build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: telecomsteve
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: telecomsteve/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests with enforced 100% coverage
        run: npm run coverage
      - name: Build
        run: npm run build

  e2e:
    name: End-to-end tests (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: telecomsteve
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: telecomsteve/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run e2e suite
        run: npx playwright test
